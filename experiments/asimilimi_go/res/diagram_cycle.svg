<text x="36" y="748" font-size="30" font-weight="700" fill="#1F3864" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">4  Merge the regimes (Theorem 8)</text>
<text x="36" y="790" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,1684">weight w<tspan font-size="20" dy="7">r</tspan><tspan dy="-7"> </tspan> ∝ prior of the regime × likelihood of the data; the posterior is the mixture, kept by its mean and covariance</text>
<path d="M213.0,816 L213.0,862" stroke="#5b6573" stroke-width="3.5" fill="none" marker-end="url(#ah)"/>
<g filter="url(#card)"><rect x="16" y="868" width="394" height="212" rx="16" fill="#fdece7" stroke="#e4572e" stroke-width="2.5"/></g>
<text x="36" y="910" font-size="30" font-weight="700" fill="#b9471a" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">5  Alarm (T9)</text>
<text x="36" y="950" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,410">NIS > χ²(m, 0.999)</text>
<text x="36" y="988" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,410">under every regime =</text>
<text x="36" y="1026" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,410">missing dynamics</text>
<g filter="url(#card)"><rect x="440" y="868" width="394" height="212" rx="16" fill="#fbeaf1" stroke="#c2417a" stroke-width="2.5"/></g>
<text x="460" y="910" font-size="30" font-weight="700" fill="#9b2c5e" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">6  Chloride (T7)</text>
<text x="460" y="950" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="440,834">probit of the sea</text>
<text x="460" y="988" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="440,834">fraction; a saturated</text>
<text x="460" y="1026" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="440,834">sample is censored</text>
<g filter="url(#card)"><rect x="864" y="868" width="394" height="212" rx="16" fill="#f1ecfa" stroke="#7d4fc9" stroke-width="2.5"/></g>
<text x="884" y="910" font-size="30" font-weight="700" fill="#5d35a3" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">7  Constraints (P6)</text>
<text x="884" y="950" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="864,1258">linear ones kept:</text>
<text x="884" y="988" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="864,1258">charge, exchanger;</text>
<text x="884" y="1026" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="864,1258">bounds by transform</text>
<g filter="url(#card)"><rect x="1288" y="868" width="394" height="212" rx="16" fill="#f6efe6" stroke="#9c6b30" stroke-width="2.5"/></g>
<text x="1308" y="910" font-size="30" font-weight="700" fill="#7a5122" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">8  Calibration (T5)</text>
<text x="1308" y="950" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1288,1682">90% coverage by</text>
<text x="1308" y="988" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1288,1682">regime; a drop points</text>
<text x="1308" y="1026" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1288,1682">to a missing closure</text>
