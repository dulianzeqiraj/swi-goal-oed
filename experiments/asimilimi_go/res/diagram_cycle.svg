<text x="36" y="406" font-size="30" font-weight="700" fill="#11805a" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">Normal regime</text>
<text x="36" y="446" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,536">boundaries as states: filter,</text>
<text x="36" y="484" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,536">exact for heads (T1);</text>
<text x="36" y="522" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,536">constants by inversion;</text>
<text x="36" y="560" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,536">initial state by smoother (T3)</text>
<rect x="17.5" y="365.5" width="517" height="10" rx="5" fill="#1baf7a"/>
<rect x="36" y="602" width="250" height="44" rx="22" fill="#e6f6ef" stroke="#1baf7a" stroke-width="2"/>
<text x="161" y="633" font-size="28" font-weight="600" fill="#11805a" text-anchor="middle" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="36,286">weight w<tspan font-size="20" dy="7">normal</tspan><tspan dy="-7"> </tspan></text>
<g filter="url(#card)"><rect x="590" y="364" width="520" height="300" rx="16" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/></g>
<text x="610" y="406" font-size="30" font-weight="700" fill="#1b5fae" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">Surge regime</text>
<text x="610" y="446" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="590,1110">the surge state opens and</text>
<text x="610" y="484" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="590,1110">decays in 2 days; the gauge</text>
<text x="610" y="522" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="590,1110">sees it at once, the heads</text>
<text x="610" y="560" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="590,1110">a day later (E10)</text>
<rect x="591.5" y="365.5" width="517" height="10" rx="5" fill="#2a78d6"/>
<rect x="610" y="602" width="250" height="44" rx="22" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
<text x="735" y="633" font-size="28" font-weight="600" fill="#1b5fae" text-anchor="middle" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="610,860">weight w<tspan font-size="20" dy="7">surge</tspan><tspan dy="-7"> </tspan></text>
<g filter="url(#card)"><rect x="1164" y="364" width="520" height="300" rx="16" fill="#ffffff" stroke="#eda100" stroke-width="2.5"/></g>
<text x="1184" y="406" font-size="30" font-weight="700" fill="#8f6200" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">Drought or flood regime</text>
<text x="1184" y="446" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1164,1684">recharge and E free; river,</text>
<text x="1184" y="484" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1164,1684">drain and seepage switch:</text>
<text x="1184" y="522" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1164,1684">ES-MDA, and the update</text>
<text x="1184" y="560" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1164,1684">stays stable (Lemma 2)</text>
<rect x="1165.5" y="365.5" width="517" height="10" rx="5" fill="#eda100"/>
<rect x="1184" y="602" width="250" height="44" rx="22" fill="#fdf3dc" stroke="#eda100" stroke-width="2"/>
<text x="1309" y="633" font-size="28" font-weight="600" fill="#8f6200" text-anchor="middle" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1184,1434">weight w<tspan font-size="20" dy="7">drought</tspan><tspan dy="-7"> </tspan></text>
