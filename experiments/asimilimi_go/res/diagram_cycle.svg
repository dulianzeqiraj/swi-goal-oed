</defs><rect width="1700" height="1104" fill="#ffffff"/><text x="26" y="44" font-size="28" font-weight="600" fill="#5b6573" text-anchor="start" letter-spacing="2.2" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">ONE ASSIMILATION STEP, NORMAL AND EXTREME</text>
<g filter="url(#card)"><rect x="16" y="92" width="520" height="212" rx="16" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2.5"/></g>
<text x="36" y="134" font-size="30" font-weight="700" fill="#1b5fae" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">1  Forecast, one per regime</text>
<text x="36" y="174" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,536">Xᶠ<tspan font-size="20" dy="7">r</tspan><tspan dy="-7"> </tspan> = Ψ₀(X) + m(X; θ) + ξ<tspan font-size="20" dy="7">r</tspan><tspan dy="-7"> </tspan></text>
<text x="36" y="212" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,536">each regime carries the</text>
<text x="36" y="250" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="16,536">event's own dynamics</text>
<g filter="url(#card)"><rect x="590" y="92" width="520" height="212" rx="16" fill="#e6f6ef" stroke="#1baf7a" stroke-width="2.5"/></g>
<text x="610" y="134" font-size="30" font-weight="700" fill="#11805a" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">2  Data arrive</text>
<text x="610" y="174" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="590,1110">heads, tide gauge, meters,</text>
<text x="610" y="212" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="590,1110">rain and soil moisture,</text>
<text x="610" y="250" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="590,1110">chloride and EC samples</text>
<g filter="url(#card)"><rect x="1164" y="92" width="520" height="212" rx="16" fill="#f1f2f4" stroke="#6b7280" stroke-width="2.5"/></g>
<text x="1184" y="134" font-size="30" font-weight="700" fill="#4b5563" text-anchor="start" letter-spacing="0" style="font-family:Inter,'Liberation Sans',Arial,sans-serif">3  Spike or event?</text>
<text x="1184" y="174" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1164,1684">each reading may be a spike:</text>
<text x="1184" y="212" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1164,1684">exact mixture of no spike and</text>
<text x="1184" y="250" font-size="28" font-weight="400" fill="#1f2328" text-anchor="start" style="font-family:Inter,'Liberation Sans',Arial,sans-serif" data-box="1164,1684">spike at sensor i (P10)</text>
